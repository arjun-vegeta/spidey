<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spidey Shoot // Roster Sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕷️</text></svg>">
  <style>
    /* Dev-only review page for the character roster. Notebook chrome, kept
       local to this file so it never touches the game's hud.css. */
    :root {
      --paper: #f5eedd;
      --navy: #152778;
      --rule: rgba(122, 150, 212, 0.28);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background-color: var(--paper);
      background-image: linear-gradient(to bottom, var(--rule) 1px, transparent 1px);
      background-size: 100% 28px;
      font-family: 'Special Elite', 'Courier Prime', monospace;
      color: var(--navy);
    }
    #app { display: grid; grid-template-columns: 260px 1fr 340px; height: 100%; }

    aside, section.card { padding: 18px 16px; overflow-y: auto; }
    aside { border-right: 2px solid rgba(21, 39, 120, 0.25); }
    section.card { border-left: 2px solid rgba(21, 39, 120, 0.25); }

    .sheet-head {
      font-size: 11px; letter-spacing: 2px; opacity: 0.65; margin-bottom: 14px;
      border-bottom: 1px dashed rgba(21, 39, 120, 0.4); padding-bottom: 8px;
    }

    .roster-row {
      display: grid; grid-template-columns: 22px 1fr; grid-template-areas: "num name" ". build";
      gap: 2px 8px; width: 100%; text-align: left; cursor: pointer;
      font-family: inherit; color: var(--navy);
      background: transparent; border: 1px solid transparent;
      border-left: 4px solid var(--ink); padding: 8px 10px; margin-bottom: 6px;
    }
    .roster-row:hover { background: rgba(21, 39, 120, 0.06); }
    .roster-row.is-active { background: rgba(21, 39, 120, 0.1); border-color: rgba(21, 39, 120, 0.4); }
    .roster-num { grid-area: num; font-size: 12px; opacity: 0.5; }
    .roster-name { grid-area: name; font-size: 14px; letter-spacing: 0.5px; color: var(--ink); }
    .roster-build { grid-area: build; font-size: 10px; letter-spacing: 1.5px; opacity: 0.55; }

    main { position: relative; }
    #stage { width: 100%; height: 100%; display: block; }
    #mode {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      font-size: 11px; letter-spacing: 2px; opacity: 0.6; white-space: nowrap;
    }
    #keys {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      font-size: 10px; letter-spacing: 1.4px; opacity: 0.5; white-space: nowrap;
    }

    .card-slot { font-size: 10px; letter-spacing: 2px; opacity: 0.55; }
    section.card h1 { font-size: 22px; margin: 6px 0 2px; color: var(--ink); letter-spacing: 0.5px; }
    .card-tagline { font-size: 11px; letter-spacing: 1.2px; opacity: 0.7; margin: 0 0 14px; }
    .card-bio { font-family: 'Courier Prime', monospace; font-size: 12.5px; line-height: 1.6; }
    .card-stats { margin: 16px 0 0; padding: 12px 0 0; border-top: 1px dashed rgba(21, 39, 120, 0.4); }
    .card-stats div { display: grid; grid-template-columns: 96px 1fr; gap: 6px; margin-bottom: 8px; }
    .card-stats dt { font-size: 10px; letter-spacing: 1.4px; opacity: 0.55; }
    .card-stats dd { margin: 0; font-size: 12px; color: var(--ink); }
    .card-foot { margin-top: 18px; font-size: 10px; letter-spacing: 1.2px; opacity: 0.5; }
  </style>
</head>
<body>
  <div id="app">
    <aside>
      <div class="sheet-head">[ DRAFT #01 // ROSTER SHEET ]</div>
      <div id="roster"></div>
    </aside>
    <main>
      <canvas id="stage"></canvas>
      <div id="mode"></div>
      <div id="keys">1-8 PICK &nbsp;·&nbsp; ←/→ CYCLE &nbsp;·&nbsp; L LINEUP &nbsp;·&nbsp; W WALK &nbsp;·&nbsp; S SWING &nbsp;·&nbsp; F SILHOUETTE</div>
    </main>
    <section class="card" id="card"></section>
  </div>
  <script type="module" src="/src/characters/preview.ts"></script>
</body>
</html>
